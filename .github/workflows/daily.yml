name: Daily macro brief

on:
  schedule:
    # 23:00 UTC ≈ 06:00 Bangkok next morning
    - cron: "0 23 * * *"
  workflow_dispatch: {}   # allow manual runs

permissions:
  contents: write   # push the news.db snapshot branch (durable DB backup)
  issues: write     # open/close the "daily run failed" alert issue

env:
  # GitHub forces Actions onto Node 24 starting 2026-06-16. Opt in explicitly so
  # the run is pinned to that runtime and the deprecation warning goes away.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install --only-binary=litellm -r requirements.txt

      # Persist the SQLite DB across runs so dedup survives and each daily run
      # only summarizes *new* articles. Split restore/save so the DB is saved
      # even if a later step (e.g. deploy) fails — the cold summarize cost is
      # then paid only once.
      - name: Restore DB cache
        uses: actions/cache/restore@v4
        with:
          path: news.db
          key: news-db-${{ github.run_id }}
          restore-keys: news-db-

      # If the cache was evicted (7-day inactivity / 10 GB LRU), fall back to the
      # durable copy kept on the db-snapshot branch. Without this, a lost cache
      # means starting from an empty DB: lost history + a costly cold re-summarize.
      - name: Seed DB from snapshot branch (cache fallback)
        run: |
          if [ -f news.db ]; then
            echo "Cache hit — news.db present ($(wc -c < news.db) bytes)."
          elif git fetch origin db-snapshot --depth=1 2>/dev/null; then
            # Current format is a gzipped DB; older snapshots hold a raw news.db.
            if git cat-file -e FETCH_HEAD:news.db.gz 2>/dev/null; then
              git show FETCH_HEAD:news.db.gz | gunzip > news.db
            else
              git show FETCH_HEAD:news.db > news.db
            fi
            echo "Cache miss — restored news.db from db-snapshot ($(wc -c < news.db) bytes)."
          else
            echo "No cache and no snapshot branch yet — starting from a fresh DB."
          fi

      - name: Run pipeline
        id: pipeline
        env:
          # Chain (src/config.py DEFAULT_LLM_CHAIN): MiniMax-M2 -> Gemini Flash ->
          # Mistral. Providers without a secret are skipped; dead or exhausted
          # ones are dropped for the rest of the run by the circuit breaker.
          # (Cerebras went paid, Groq retired llama-3.1-8b-instant, and the
          # Cloudflare token lacks the Workers AI scope — all removed. To re-add
          # Cloudflare, grant the scope and set LLM_CHAIN + CLOUDFLARE_API_KEY.)
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          # 5 articles per request, 6 requests in flight: ~100 articles/min on
          # MiniMax. The cap is ~3x normal daily volume so a backlog drains over
          # a couple of runs; articles older than 7 days are shown by title only.
          SUMMARY_BATCH_SIZE: "5"
          LLM_CONCURRENCY: "6"
          MAX_ARTICLES_PER_RUN: "1000"
          SUMMARY_MAX_AGE_DAYS: "7"
        # --strict: exit 3 (after rendering) if nothing could be summarized, so a
        # silent LLM outage turns the run red and opens an alert issue. The
        # later steps still run and deploy the title-only site.
        run: python -m src.pipeline --strict

      - name: Save DB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: news.db
          key: news-db-${{ github.run_id }}

      # Durable, auto-restorable backup: store a gzipped news.db on its own
      # orphan branch. Uses git plumbing so it never touches the working tree or
      # the main branch — each push replaces the branch with a single fresh
      # commit (no history bloat). This is the copy the "Seed DB" step restores.
      # GitHub rejects files > 100 MB, so the DB is compressed and size-guarded;
      # the step is non-fatal so a backup problem can never block the deploy.
      - name: Persist DB to snapshot branch
        if: always()
        continue-on-error: true
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          MAX_SNAPSHOT_BYTES: "90000000"   # stay well under GitHub's 100 MB cap
        run: |
          test -f news.db || { echo "No news.db to persist."; exit 0; }
          gzip -9 -c news.db > news.db.gz
          raw=$(wc -c < news.db); gz=$(wc -c < news.db.gz)
          echo "news.db: ${raw} bytes, news.db.gz: ${gz} bytes"
          if [ "$gz" -gt "$MAX_SNAPSHOT_BYTES" ]; then
            echo "::warning title=DB snapshot skipped::news.db.gz is ${gz} bytes (> ${MAX_SNAPSHOT_BYTES}); not pushing to db-snapshot. The Actions cache and artifact still hold the DB."
            exit 0
          fi
          blob=$(git hash-object -w news.db.gz)
          tree=$(printf '100644 blob %s\tnews.db.gz\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "DB snapshot (run ${GITHUB_RUN_ID})")
          git push -f origin "$commit:refs/heads/db-snapshot"
          echo "Pushed news.db.gz to db-snapshot (${gz} bytes)."

      # 90-day insurance copy, downloadable from the run page if you ever need to
      # re-seed by hand (e.g. the snapshot branch was deleted).
      - name: Backup DB (artifact)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: news-db
          path: news.db
          retention-days: 90
          overwrite: true

      # Deploy whenever a site was built, even if the pipeline or a backup step
      # failed: a stale DB backup must never leave the public site stale too.
      - name: Deploy to Cloudflare Pages
        if: ${{ !cancelled() && hashFiles('site/index.html') != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=macro-brief --commit-dirty=true

  # Alert: open (or comment on) a single tracking issue when the daily run
  # fails, and close it automatically once a run succeeds again. GitHub only
  # emails about failed scheduled runs to the last editor of the cron, which is
  # how 27 red days went unnoticed.
  alert:
    needs: build-and-deploy
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESULT: ${{ needs.build-and-deploy.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      LABEL: daily-run-failure
    steps:
      - name: Open, update or close the alert issue
        run: |
          gh label create "$LABEL" --color B60205 \
            --description "Opened automatically when the daily brief run fails" 2>/dev/null || true
          issue=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          if [ "$RESULT" = "success" ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "Daily run succeeded again: $RUN_URL"
            fi
          elif [ "$RESULT" = "failure" ]; then
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "Failed again on $(date -u +%F): $RUN_URL"
            else
              gh issue create --label "$LABEL" --title "Daily macro brief run is failing" \
                --body "The scheduled run failed on $(date -u +%F): $RUN_URL

          Check the failing step's log (summarization outage = all LLM providers exhausted; see the run summary). This issue is closed automatically by the next successful run."
            fi
          fi
