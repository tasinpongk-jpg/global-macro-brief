name: Daily macro brief

on:
  schedule:
    # 23:00 UTC ≈ 06:00 Bangkok next morning
    - cron: "0 23 * * *"
  workflow_dispatch: {}   # allow manual runs

permissions:
  contents: read

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      # Persist the SQLite DB across runs so dedup survives and each daily run
      # only summarizes *new* articles. Split restore/save so the DB is saved
      # even if a later step (e.g. deploy) fails — the cold summarize cost is
      # then paid only once.
      - name: Restore DB cache
        uses: actions/cache/restore@v4
        with:
          path: news.db
          key: news-db-${{ github.run_id }}
          restore-keys: news-db-

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python -m src.pipeline

      - name: Save DB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: news.db
          key: news-db-${{ github.run_id }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=macro-brief --commit-dirty=true
