name: Daily macro brief

on:
  schedule:
    # 23:00 UTC ≈ 06:00 Bangkok next morning
    - cron: "0 23 * * *"
  workflow_dispatch: {}   # allow manual runs

permissions:
  contents: write   # push the news.db snapshot branch (durable DB backup)

env:
  # GitHub forces Actions onto Node 24 starting 2026-06-16. Opt in explicitly so
  # the run is pinned to that runtime and the deprecation warning goes away.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install --only-binary=litellm -r requirements.txt

      # Persist the SQLite DB across runs so dedup survives and each daily run
      # only summarizes *new* articles. Split restore/save so the DB is saved
      # even if a later step (e.g. deploy) fails — the cold summarize cost is
      # then paid only once.
      - name: Restore DB cache
        uses: actions/cache/restore@v4
        with:
          path: news.db
          key: news-db-${{ github.run_id }}
          restore-keys: news-db-

      # If the cache was evicted (7-day inactivity / 10 GB LRU), fall back to the
      # durable copy kept on the db-snapshot branch. Without this, a lost cache
      # means starting from an empty DB: lost history + a costly cold re-summarize.
      - name: Seed DB from snapshot branch (cache fallback)
        run: |
          if [ -f news.db ]; then
            echo "Cache hit — news.db present ($(wc -c < news.db) bytes)."
          elif git fetch origin db-snapshot --depth=1 2>/dev/null; then
            git show FETCH_HEAD:news.db > news.db
            echo "Cache miss — restored news.db from db-snapshot ($(wc -c < news.db) bytes)."
          else
            echo "No cache and no snapshot branch yet — starting from a fresh DB."
          fi

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          # Cloudflare Workers AI backstop (last cloud fallback). Reuses the
          # existing Pages token + account id — no new secret. The token must be
          # granted the "Workers AI" Read+Run scope in Cloudflare for this to
          # activate; until then the provider is simply skipped.
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Cap summaries per run so the one-time backlog from newly-added feeds
          # drains over a few days instead of hammering free-tier LLM quotas.
          # Well above normal daily new-article volume, so steady state is uncapped.
          MAX_ARTICLES_PER_RUN: "300"
        run: python -m src.pipeline

      - name: Save DB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: news.db
          key: news-db-${{ github.run_id }}

      # Durable, auto-restorable backup: store news.db on its own orphan branch.
      # Uses git plumbing so it never touches the working tree or the main branch
      # — each push replaces the branch with a single fresh commit (no history
      # bloat). This is the copy the "Seed DB" step above restores from.
      - name: Persist DB to snapshot branch
        if: always()
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          test -f news.db || { echo "No news.db to persist."; exit 0; }
          blob=$(git hash-object -w news.db)
          tree=$(printf '100644 blob %s\tnews.db\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "DB snapshot (run ${GITHUB_RUN_ID})")
          git push -f origin "$commit:refs/heads/db-snapshot"
          echo "Pushed news.db to db-snapshot ($(wc -c < news.db) bytes)."

      # 90-day insurance copy, downloadable from the run page if you ever need to
      # re-seed by hand (e.g. the snapshot branch was deleted).
      - name: Backup DB (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-db
          path: news.db
          retention-days: 90
          overwrite: true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=macro-brief --commit-dirty=true

      # Mirror the same site/ to the older `news-dashboard` Pages project
      # (news-dashboard-2ob.pages.dev — Cloudflare auto-suffixed the subdomain,
      # same as macro-brief → macro-brief-buy). It was a one-off direct upload
      # with nothing feeding it, so it had frozen at its first deploy; this keeps
      # that bookmarked URL in step with the primary site every morning.
      # If the project turns out to be named something else, correct the
      # --project-name here (`wrangler pages project list` prints the real names).
      # continue-on-error: the mirror must never turn a good brief run red — the
      # primary deploy above has already published by this point.
      - name: Deploy to Cloudflare Pages (news-dashboard mirror)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=news-dashboard --commit-dirty=true
