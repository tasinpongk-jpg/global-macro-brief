# Global-macro RSS feeds (English-only v1).
# `topic` is a hint; the LLM still classifies each article independently.
# Verify each URL resolves before relying on it — feeds break and rename.

feeds:
  # ── Energy / Oil ────────────────────────────────────────────────────────────
  - name: OilPrice
    url: https://oilprice.com/rss/main
    topic: Energy/Oil
  - name: CNBC Energy
    url: https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=19836768
    topic: Energy/Oil

  # ── Markets / Macro ─────────────────────────────────────────────────────────
  - name: Investing.com News
    url: https://www.investing.com/rss/news.rss
