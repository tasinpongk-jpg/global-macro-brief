[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "site"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
ignore = [
    "SIM105",  # contextlib.suppress — explicit try/except reads clearer here
    "SIM905",  # the stop-word list is clearer as one split string
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
